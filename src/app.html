<!doctype html>
<html class="dark" data-theme="crimson" lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			// Apply the saved Skeleton theme before first paint to avoid a flash.
			try {
				const theme = localStorage.getItem('theme');
				if (theme) document.documentElement.dataset.theme = theme;
			} catch {
				// Ignore unavailable localStorage.
			}
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/Rubik-VariableFont_wght.ttf"
			as="font"
			type="font/ttf"
			crossorigin
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
